spring:
  config:
    import: optional:file:${AXIZ_RUNTIME_DIRECTORY:.runtime/}aws.properties
  application:
    name: acquirer-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: ${PORT:8081}
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  level:
    org.springframework.web: WARN
  pattern:
    level: "%5p [${spring.application.name}] [%X{correlationId}]"
axiz:
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
    role-arn: ${AWS_ROLE_ARN:}
    token-file: ${AWS_WEB_IDENTITY_TOKEN_FILE:}
  internal-secret-id: /axiz/internal-key
  database:
    enabled: false
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:7001}
    name: axiz
    user: ${DB_USER:axiz_acquirer}
    schema: acquirer
    ca: ${DB_CA:.runtime/rds-ca.crt}
  jobs-enabled: ${JOBS_ENABLED:true}
  acquirer-url: ${ACQUIRER_URL:http://localhost:8081}
  topic-arn: ${PAYMENT_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:axiz-payments.fifo}
  queue-url: ${SETTLEMENT_QUEUE_URL:http://localhost:4566/000000000000/axiz-settlement.fifo}
  bucket: axiz-receipts
  projection-table: axiz-settlements
  acquirer-table: axiz-authorizations
  event-bus: axiz-payments
  kms-key: alias/axiz-receipts
  kafka-bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
  kafka-topic: axiz.payment.events
  redis-host: ${REDIS_HOST:localhost}
  redis-port: ${REDIS_PORT:6379}
  resilience:
    timeout-ms: ${RESILIENCE_TIMEOUT_MS:900}
    max-attempts: ${RESILIENCE_MAX_ATTEMPTS:3}
    max-concurrent: ${RESILIENCE_MAX_CONCURRENT:8}
    ingress-per-second: ${RESILIENCE_INGRESS_PER_SECOND:30}
    outbound-per-second: ${RESILIENCE_OUTBOUND_PER_SECOND:20}
    open-seconds: ${RESILIENCE_OPEN_SECONDS:10}
