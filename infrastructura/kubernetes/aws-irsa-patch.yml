# Se sustituye el mecanismo local de emisión de tokens al adaptar el Deployment a EKS de AWS.
# Se aplica como parche estratégico al Deployment generado, después de configurar el proveedor OIDC real.
# Se actualizan los ARN, endpoints, imagen publicada y CA de Aurora en la configuración del entorno AWS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiz-payment
  namespace: axiz
spec:
  template:
    spec:
      hostAliases: []
      initContainers:
        - name: identity-token
          $patch: delete
      containers:
        - name: identity-token-loop
          $patch: delete
        - name: payment
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ENDPOINT_URL
              value: ""
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /identity/web-identity.token
      volumes:
        - name: identity
          emptyDir: null
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: web-identity.token
