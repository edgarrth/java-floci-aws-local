name: axiz-floci
x-build: &application-build
  context: ..
  dockerfile: infrastructura/Dockerfile.application
  additional_contexts:
    java-base: service:java-base
x-common: &common
  restart: unless-stopped
  networks: [axiz]
  env_file: ../.env
  volumes:
    - ../.runtime:/app/runtime:ro
  environment: &common-env
    AWS_REGION: ${AWS_REGION:-us-east-1}
    AXIZ_RUNTIME_DIRECTORY: /app/runtime/
    AWS_ENDPOINT_URL: http://floci:4566
    DB_HOST: floci
    DB_PORT: 7001
    DB_CA: /app/runtime/rds-ca.crt
    REDIS_HOST: floci
    REDIS_PORT: 6379
    KAFKA_BOOTSTRAP_FILE: /app/runtime/kafka-bootstrap
  depends_on:
    bootstrap:
      condition: service_completed_successfully
services:
  java-base:
    image: axiz-java-base:2.0.0
    pull_policy: never
    build:
      context: ..
      dockerfile: infrastructura/Dockerfile.base
    command: ["true"]
  tools:
    image: axiz-tools:2.0.0
    pull_policy: never
    profiles: [build]
    build:
      context: ..
      dockerfile: infrastructura/Dockerfile.tools
      additional_contexts:
        java-base: service:java-base
    command: ["true"]
  floci:
    image: floci/floci:2.1.0
    container_name: axiz-floci
    networks: [axiz]
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:7001-7005:7001-7005"
      - "127.0.0.1:6379:6379"
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_DOCKER_NETWORK: axiz-network
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: postgres:18.6
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7005"
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: floci
      FLOCI_SERVICES_ELASTICACHE_DEFAULT_IMAGE: redis:8.8.3
      FLOCI_SERVICES_ELASTICACHE_PROXY_BASE_PORT: "6379"
      FLOCI_SERVICES_ELASTICACHE_PROXY_MAX_PORT: "6379"
      FLOCI_SERVICES_ELASTICACHE_ENDPOINT_HOST: floci
      FLOCI_SERVICES_MSK_DEFAULT_IMAGE: redpandadata/redpanda:v26.2.3
      FLOCI_SERVICES_EKS_DEFAULT_IMAGE: rancher/k3s:v1.35.9-k3s1
      FLOCI_SERVICES_EKS_MOCK: ${EKS_MOCK:-true}
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
      FLOCI_SERVICES_IAM_SEED_DEPLOYER_PRINCIPAL: "true"
      FLOCI_SERVICES_UI_ENABLED: "false"
      QUARKUS_HTTP_ACCESS_LOG_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data-v2:/app/data
  bootstrap:
    image: axiz-tools:2.0.0
    pull_policy: never
    build:
      context: ..
      dockerfile: infrastructura/Dockerfile.tools
      additional_contexts:
        java-base: service:java-base
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: floci
      AWS_SECRET_ACCESS_KEY: floci
      BOOTSTRAP_TARGET: ${BOOTSTRAP_TARGET:-compose}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-LocalBootstrapOnly-25!}
      FLOCI_BOOTSTRAP_READ_TIMEOUT_SECONDS: ${FLOCI_BOOTSTRAP_READ_TIMEOUT_SECONDS:-900}
      FLOCI_BOOTSTRAP_WAIT_TIMEOUT_SECONDS: ${FLOCI_BOOTSTRAP_WAIT_TIMEOUT_SECONDS:-1800}
    depends_on:
      floci:
        condition: service_started
    volumes:
      - ../.runtime:/workspace/.runtime
      - floci-data-v2:/floci-data:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [axiz]
    command: ["python3", "infrastructura/bootstrap.py", "provision"]
  token-renewer:
    image: axiz-tools:2.0.0
    pull_policy: never
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    volumes:
      - ../.runtime:/workspace/.runtime
    networks: [axiz]
    command: ["python3", "infrastructura/bootstrap.py", "tokens-loop"]
  payment:
    <<: *common
    image: axiz-payment-service:2.0.0
    pull_policy: never
    profiles: [full,build]
    build:
      <<: *application-build
      args: {SERVICE: payment-service}
    ports: ["127.0.0.1:8080:8080"]
    environment:
      <<: *common-env
      AWS_ROLE_ARN: arn:aws:iam::000000000000:role/axiz-payment
      AWS_WEB_IDENTITY_TOKEN_FILE: /app/runtime/payment.token
      DB_USER: axiz_payment
  settlement:
    <<: *common
    image: axiz-settlement-service:2.0.0
    pull_policy: never
    profiles: [full,build]
    build:
      <<: *application-build
      args: {SERVICE: settlement-service}
    ports: ["127.0.0.1:8081:8081"]
    environment:
      <<: *common-env
      AWS_ROLE_ARN: arn:aws:iam::000000000000:role/axiz-settlement
      AWS_WEB_IDENTITY_TOKEN_FILE: /app/runtime/settlement.token
      DB_USER: axiz_settlement
  seed:
    image: axiz-tools:2.0.0
    pull_policy: never
    profiles: [full]
    depends_on:
      payment:
        condition: service_started
      settlement:
        condition: service_started
    volumes: ["../.runtime:/workspace/.runtime"]
    networks: [axiz]
    command: ["python3", "datasets/seed.py", "http://payment:8080"]
  routes:
    image: axiz-tools:2.0.0
    pull_policy: never
    profiles: [full]
    depends_on:
      seed:
        condition: service_completed_successfully
    networks: [axiz]
    command: ["python3", "infrastructura/routes.py", "http://payment:8080", "http://settlement:8081"]
  eks-deploy:
    env_file: ../.env
    image: axiz-tools:2.0.0
    pull_policy: never
    profiles: [eks]
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: floci
      AWS_SECRET_ACCESS_KEY: floci
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - ../.runtime:/workspace/.runtime
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [axiz]
    command: ["python3", "infrastructura/eks.py"]
networks:
  axiz:
    name: axiz-network
volumes:
  floci-data-v2:
